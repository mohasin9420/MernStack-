<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type ="text/javascript">
        function mousehover()
        {
            alert("Doing mouse hover");
        }
        function mouseout()
        {
            alert("taking mouse out");
        }

    </script>
    <div onmouseover="mousehover()" onmouseout="mouseout()">
        <h1>Mouse hover demo</h1>

    </div>
</body>
</html>
