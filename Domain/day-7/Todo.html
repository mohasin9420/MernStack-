<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>

    <style>
        body {
            background-color: lightblue;
            text-align: center;
            font-family: Arial;
        }

        h1 {
            color: darkblue;
        }

        input {
            padding: 10px;
        }

        button {
            padding: 10px;
            margin: 5px;
            color: white;
            border: none;
        }

        .add {
            background-color: green;
        }

        .delete {
            background-color: red;
        }

        li {
            background-color: white;
            padding: 10px;
            margin: 10px;
            list-style: none;
        }
    </style>

    <script src="script1.js" defer></script>
</head>

<body>

    <h1>My To-Do List</h1>

    <input type="text" id="task" placeholder="Enter task">

    <button class="add" onclick="addTask()">Add</button>

    <ul id="taskList"></ul>

</body>
</html>
