<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even and Odd Numbers</title>
</head>

<body>

    <h1>This is a demo of the script tag</h1>

    <script>
        document.write("Even Number");
        document.write("<br>");

        for ( loop = 1; loop <= 100; loop++) {
            if (loop % 2 == 0) {
                document.write(loop);
                document.write("<br>");
            } else {
                document.write("Odd Number");
                document.write("<br>");
            }
        }
    </script>

</body>
</html>
