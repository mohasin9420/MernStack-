<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Items and Prices</title>
</head>
<body>
     

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding-top: 30px;
        }

        .container {
            text-align: center;
        }

        table {
            border-collapse: collapse;
            width: 400px;
            margin: 20px auto;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #087ff5;
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Sample Online Items and Prices</h2>

        <table>
            <tr>
                <th>Item</th>
                <th>Price</th>
            </tr>

            <tr>
                <td>Laptop</td>
                <td>$800</td>
            </tr>

            <tr>
                <td>Smartphone</td>
                <td>$400</td>
            </tr>

            <tr>
                <td>Headphones</td>
                <td>$50</td>
            </tr>

            <tr>
                <td>Tablet</td>
                <td>$300</td>
            </tr>
        </table>

    </div>

</body>
</body>
</html>
