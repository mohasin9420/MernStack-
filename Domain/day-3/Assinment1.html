<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Table</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* Header */
        header {
            text-align: center;
            padding: 20px;
            background-color: #4298d1;
            color: white;
        }

        header h1 {
            margin: 0 0 10px;
        }

        /* Main */
        main {
            padding: 20px;
            margin: 10px;
        }

        /* Table Section */
        section {
            background-color: white;
            padding: 20px;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #4298d1;
            color: white;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 15px;
            margin-top: 10px;
            background-color: #4298d1;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>Styled Table</h1>
        <p>Enjoy the beauty of a styled HTML table!</p>
    </header>

    <main>
        <section>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Occupation</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>John Doe</td>
                        <td>28</td>
                        <td>Software Developer</td>
                    </tr>

                    <tr>
                        <td>Jane Smith</td>
                        <td>35</td>
                        <td>Graphic Designer</td>
                    </tr>

                    <tr>
                        <td>Robert Johnson</td>
                        <td>42</td>
                        <td>Teacher</td>
                    </tr>
                </tbody>
            </table>

        </section>
    </main>

    <footer>
        <p>© 2023 Styled Table. All rights reserved.</p>
    </footer>

</body>
</html>
