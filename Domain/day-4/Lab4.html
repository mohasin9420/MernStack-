<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 600px;
            margin: 20px auto;
            padding: 15px;
            background-color: white;
            border: 1px solid #ccc;
        }

        h1 {
            text-align: center;
            color: blue;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #bbb;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        .radio,
        .checkbox {
            margin: 6px 0;
        }

        .radio label,
        .checkbox label {
            display: block;
            margin: 5px 0;
        }

        .submit-btn {
            display: block;
            margin: 15px auto 0;
            padding: 8px 40px;
            background-color: #0099ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #007acc;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Survey Form</h1>

        <form>

            <label for="name">Name</label>
            <input type="text" id="name"
                   placeholder="Enter your name" required>

            <label for="email">Email</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <label for="age">Age</label>
            <input type="number" id="age"
                   placeholder="Enter your age" min="1" max="100">

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob">

            <label>Gender</label>
            <div class="radio">
                <label>
                    <input type="radio" name="gender" value="male">
                    Male
                </label>

                <label>
                    <input type="radio" name="gender" value="female">
                    Female
                </label>

                <label>
                    <input type="radio" name="gender" value="other">
                    Other
                </label>
            </div>

            <label>
                Would you recommend this survey form to a friend?
            </label>

            <div class="radio">
                <label>
                    <input type="radio" name="recommend" value="yes">
                    Yes
                </label>

                <label>
                    <input type="radio" name="recommend" value="no">
                    No
                </label>

                <label>
                    <input type="radio" name="recommend" value="maybe">
                    Maybe
                </label>
            </div>

            <label>
                Languages and Frameworks known
                <small>(Check all that apply)</small>
            </label>

            <div class="checkbox">
                <label>
                    <input type="checkbox" name="skills" value="java">
                    Java
                </label>

                <label>
                    <input type="checkbox" name="skills" value="python">
                    Python
                </label>

                <label>
                    <input type="checkbox" name="skills" value="react">
                    React
                </label>

                <label>
                    <input type="checkbox" name="skills" value="angular">
                    Angular
                </label>

                <label>
                    <input type="checkbox" name="skills" value="spring">
                    Spring
                </label>

                <label>
                    <input type="checkbox" name="skills" value="javascript">
                    JavaScript
                </label>
            </div>

            <label for="comments">
                Any comments or suggestions
            </label>

            <textarea id="comments"
                      placeholder="Enter your comments"></textarea>

            <button type="submit" class="submit-btn">
                Sign Up
            </button>

        </form>

    </div>

</body>
</html>
