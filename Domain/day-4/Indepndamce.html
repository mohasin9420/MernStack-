<!DOCTYPE html>
<html>
<head>
    <title>Independence Day</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            text-align: center;
            background: linear-gradient(#ff9933, white, #138808);
        }

        .box {
            width: 70%;
            margin: 100px auto;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 20px gray;
        }

        h1 {
            color: #ff6600;
            font-size: 40px;
        }

        h2 {
            color: #000080;
        }

        p {
            font-size: 18px;
            color: #444;
        }

        
        button {
            background: #138808;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #ff6600;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="chakra"></div>

        <h1>Happy Independence Day 🇮🇳</h1>

        <h2>15 August 2026</h2>

        <p>
            Let us celebrate the freedom, unity and
            strength of our great nation.
        </p>

        <button>Jai Hind 🇮🇳</button>

    </div>

</body>
</html>
